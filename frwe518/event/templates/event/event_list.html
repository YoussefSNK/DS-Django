<!DOCTYPE html>
<html>
<head>
    <title>Liste des événements</title>
</head>
<body>
    <h1>Liste des événements</h1>
    
    {% if events %}
        <ul>
        {% for event in events %}
            <li>
                <h2>{{ event.title }}</h2>
                <p>Date: {{ event.date }}</p>
                <p>Lieu: {{ event.location }}</p>
                <p>{{ event.description }}</p>
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>Aucun événement disponible.</p>
    {% endif %}
</body>
</html>
